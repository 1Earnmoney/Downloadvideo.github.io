<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>لوحة الأدمن</title>
<style>
:root{--bg:#0e1116;--card:#171c24;--line:#2a313c;--tx:#eef1f5;--mut:#8b95a3;--a:#7c3aed;--b:#4f46e5;box-sizing:border-box}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",Tahoma,sans-serif;min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);display:flex;flex-direction:column;align-items:center}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.w{width:100%;max-width:520px;padding:16px;flex:1}
h1{font-size:19px;margin:6px 0 16px;display:flex;align-items:center;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 12px;color:var(--mut);font-weight:600}
label.f{display:block;font-size:13px;color:var(--mut);margin-bottom:10px}
input[type=text],input[type=password]{width:100%;margin-top:6px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;font-size:15px}
.cl{display:flex;gap:10px}
.cl label{flex:1;font-size:13px;color:var(--mut)}
input[type=color]{display:block;width:100%;height:44px;margin-top:6px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:3px}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sw i{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s}.sw i:active{transform:scale(.9)}
.btn{display:inline-flex;gap:7px;align-items:center;justify-content:center;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:11px;padding:10px 14px;font:inherit;font-size:14px;cursor:pointer}
.btn.p{background:linear-gradient(135deg,var(--a),var(--b));border-color:transparent;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=file]{display:none}
.lgp{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;overflow:hidden;color:#fff}
.lgp img{width:100%;height:100%;object-fit:cover}
.pv{border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line)}
.pv .t b{display:block;font-size:16px}.pv .t span{font-size:12px;color:var(--mut)}
.pv .btn{margin-inline-start:auto}
#lock{max-width:340px;margin:20vh auto 0;text-align:center}
#msg{font-size:13px;margin-top:8px;min-height:18px;color:#f87171}
.ok{color:#4ade80!important}
.note{font-size:12px;color:var(--mut);line-height:1.7}
footer{padding:10px 16px 18px;color:var(--mut);font-size:13px}footer b{color:var(--tx)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></symbol>
<symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5zM8 3v6h7V3M8 21v-7h8v7"/></symbol>
<symbol id="i-re" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
<symbol id="i-img" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></symbol>
<symbol id="i-code" viewBox="0 0 24 24"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></symbol>
</defs></svg>

<div class="w" id="lock">
  <div class="lgp" style="margin:0 auto 14px"><svg class="ic" style="width:30px;height:30px"><use href="#i-lock"/></svg></div>
  <h1 style="justify-content:center">لوحة الأدمن</h1>
  <input type="password" id="pin" inputmode="numeric" placeholder="الرمز السري" autocomplete="off">
  <div style="margin-top:12px"><button class="btn p" id="go" style="width:100%">دخول</button></div>
  <div id="msg"></div>
  <p class="note">الرمز الافتراضي أول مرة: 1234 (غيّره من الداخل)</p>
</div>

<div class="w" id="panel" style="display:none">
  <h1><svg class="ic"><use href="#i-gear"/></svg>لوحة الأدمن</h1>

  <div class="card"><h2>معاينة</h2>
    <div class="pv" id="pv"><div class="lgp" id="pl" style="width:44px;height:44px;border-radius:12px"></div>
      <div class="t"><b id="pn"></b><span id="ps"></span></div>
      <span class="btn p" id="pb">زر</span></div></div>

  <div class="card"><h2>الشعار</h2>
    <div class="row" style="align-items:center">
      <div class="lgp" id="lp"></div>
      <label class="btn p"><svg class="ic"><use href="#i-up"/></svg>رفع لوجو<input type="file" id="lf" accept="image/*"></label>
      <button class="btn" id="lr"><svg class="ic"><use href="#i-trash"/></svg>حذف</button>
    </div></div>

  <div class="card"><h2>الألوان</h2>
    <div class="cl">
      <label>اللون الأول<input type="color" id="ca"></label>
      <label>اللون الثاني<input type="color" id="cb"></label>
      <label>الخلفية<input type="color" id="cbg"></label>
    </div>
    <label class="f" style="margin-top:12px">ألوان جاهزة</label>
    <div class="sw" id="sw"></div></div>

  <div class="card"><h2>النصوص</h2>
    <label class="f">اسم التطبيق<input type="text" id="nm"></label>
    <label class="f">الوصف الصغير<input type="text" id="sb"></label>
    <label class="f" style="margin:0">اسم المطور في الأسفل<input type="text" id="dv"></label></div>

  <div class="card"><h2>تغيير الرمز السري</h2>
    <label class="f" style="margin:0">رمز جديد (اتركه فارغاً لو ما تبي تغيّره)<input type="password" id="np" inputmode="numeric"></label>
    <p class="note" style="margin:8px 0 0">الرمز يحمي اللوحة داخل جهازك فقط وليس حماية قوية، ويمكن لأي شخص يملك الجهاز أو الملفات تجاوزه.</p></div>

  <div class="row">
    <button class="btn p" id="sv"><svg class="ic"><use href="#i-save"/></svg>حفظ</button>
    <button class="btn" id="rs"><svg class="ic"><use href="#i-re"/></svg>استرجاع الافتراضي</button>
    <a class="btn" href="index.html"><svg class="ic"><use href="#i-back"/></svg>رجوع للتطبيق</a>
  </div>
  <div id="msg2" class="note ok" style="margin-top:10px;min-height:18px"></div>
</div>

<footer>صنع من المطور <b id="fd">سعود</b><svg class="ic" style="width:15px;height:15px;vertical-align:-3px;margin-inline-start:4px;color:var(--a)"><use href="#i-code"/></svg></footer>

<script>
const $=id=>document.getElementById(id);
const D={a:'#7c3aed',b:'#4f46e5',bg:'#0e1116',name:'محرّك الصور المتحركة',sub:'يعمل بدون إنترنت',dev:'سعود',logo:''};
const ld=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const st=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let C={...D,...JSON.parse(ld('cfg')||'{}')};
const PRESETS=[['#7c3aed','#4f46e5'],['#ef4444','#f97316'],['#10b981','#059669'],['#0ea5e9','#2563eb'],['#ec4899','#be185d'],['#f59e0b','#d97706'],['#14b8a6','#0ea5e9'],['#64748b','#334155']];
const sw=$('sw');PRESETS.forEach(p=>{const i=document.createElement('i');i.style.background=`linear-gradient(135deg,${p[0]},${p[1]})`;i.onclick=()=>{C.a=p[0];C.b=p[1];fill()};sw.appendChild(i)});
async function h(x){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sk:'+x));return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}
async function check(){
  const p=$('pin').value,sv=ld('pinh'),hh=await h(p);
  if((sv&&sv===hh)||(!sv&&p==='1234')){$('lock').style.display='none';$('panel').style.display='block';fill()}
  else{$('msg').textContent='الرمز غير صحيح'}}
$('go').onclick=check;$('pin').onkeydown=e=>{if(e.key==='Enter')check()};
function logo(el){el.innerHTML=C.logo?`<img src="${C.logo}" alt="">`:'<svg class="ic" style="width:60%;height:60%"><use href="#i-img"/></svg>'}
function fill(){
  $('ca').value=C.a;$('cb').value=C.b;$('cbg').value=C.bg;$('nm').value=C.name;$('sb').value=C.sub;$('dv').value=C.dev;
  logo($('lp'));logo($('pl'));prev()}
function prev(){
  const r=document.documentElement.style;r.setProperty('--a',C.a);r.setProperty('--b',C.b);
  $('pv').style.background=C.bg;$('pn').textContent=C.name;$('ps').textContent=C.sub;$('fd').textContent=C.dev}
['ca','cb','cbg'].forEach((i,k)=>$(i).oninput=e=>{C[['a','b','bg'][k]]=e.target.value;prev()});
[['nm','name'],['sb','sub'],['dv','dev']].forEach(([i,k])=>$(i).oninput=e=>{C[k]=e.target.value;prev()});
$('lf').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{
  const s=256,c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d'),m=Math.min(im.naturalWidth,im.naturalHeight);
  g.drawImage(im,(im.naturalWidth-m)/2,(im.naturalHeight-m)/2,m,m,0,0,s,s);C.logo=c.toDataURL('image/png');fill()};im.src=URL.createObjectURL(f)};
$('lr').onclick=()=>{C.logo='';fill()};
$('sv').onclick=async()=>{
  st('cfg',JSON.stringify(C));const np=$('np').value;if(np){st('pinh',await h(np));$('np').value=''}
  $('msg2').textContent='تم الحفظ، وسيظهر التغيير في التطبيق مباشرة'};
$('rs').onclick=()=>{C={...D};fill();st('cfg',JSON.stringify(C));$('msg2').textContent='تم استرجاع الإعدادات الافتراضية'};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
